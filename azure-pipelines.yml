# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# Starter pipeline with Bruno + Azure DevOps Test Plan update

trigger:
- main

pool:
  name: 'Default'

variables:
  # Azure DevOps configuration
  ADO_ORG: 'ngatran283'                  # your Azure DevOps org
  ADO_PROJECT: 'demo'          # your Azure DevOps project
  ADO_PAT: $(PersonalAccessToken)    # secret PAT stored in pipeline
  ADO_TEST_PLAN_ID: '3'          # your Test Plan ID
  ADO_TEST_SUITE_ID: '5'         # optional, target specific suite

  # Bruno configuration
  brunoCollectionPath: 'test1'
  brunoEnvironment: 'local'
  testReportFile: 'junit-report.xml'

steps:
# 1️⃣ Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# 2️⃣ Install Bruno CLI
- script: |
    sudo npm install -g @usebruno/cli
  displayName: 'Install Bruno CLI'

# 3️⃣ Install Node dependencies for test plan update script
- script: |
    sudo npm install xml2js node-fetch
  displayName: 'Install Node.js Dependencies'

# 4️⃣ Run Bruno Tests and generate JUnit report
- script: |
    bru run "$(brunoCollectionPath)" --output "$(Build.ArtifactStagingDirectory)/$(testReportFile)" --format junit --env $(brunoEnvironment)
  displayName: 'Run Bruno Tests and Generate JUnit Report'

# 5️⃣ Update Azure DevOps Test Plan with Bruno results
- script: |
    node updateTestPlan.js
  displayName: 'Update Azure DevOps Test Plan with Bruno Results'
  env:
    ADO_ORG: $(ADO_ORG)
    ADO_PROJECT: $(ADO_PROJECT)
    ADO_PAT: $(ADO_PAT)
    ADO_TEST_PLAN_ID: $(ADO_TEST_PLAN_ID)
    ADO_TEST_SUITE_ID: $(ADO_TEST_SUITE_ID)
    TEST_REPORT_FILE: $(Build.ArtifactStagingDirectory)/$(testReportFile)
