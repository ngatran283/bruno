# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: 'Default'

variables:
  ADO_ORG: 'my-org'
  ADO_PROJECT: 'my-project'
  ADO_PAT: $(PersonalAccessToken)
  ADO_TEST_PLAN_ID: '4'
  ADO_TEST_SUITE_ID: '5'
  brunoCollectionPath: 'test1'
  brunoEnvironment: 'local'
  testReportFile: 'junit-report.xml'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    sudo npm install -g @usebruno/cli
  displayName: 'Install Bruno CLI'

- script: |
    bru run "$(brunoCollectionPath)" \
      --output "$(Build.ArtifactStagingDirectory)/$(testReportFile)" \
      --format junit \
      --env "$(brunoEnvironment)"
  displayName: 'Run Bruno Tests and Generate JUnit Report'

- script: |
    sudo npm audit fix --force
    sudo npm install xml2js node-fetch
    node updateTestPlan.js
  displayName: 'Update Azure DevOps Test Plan with Bruno Results'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/junit-report.xml'
    testRunTitle: 'Bruno API Tests'
  displayName: 'Publish Test Results to Azure DevOps'
