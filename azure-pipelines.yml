# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: 'Default'

variables:
  brunoCollectionPath: 'test1'
  brunoEnvironment: 'local'
  testReportFile: 'junit-report.xml'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    sudo npm install -g @usebruno/cli
  displayName: 'Install Bruno CLI'

- script: |
    bru run "$(brunoCollectionPath)" \
      --output "$(Build.ArtifactStagingDirectory)/$(testReportFile)" \
      --format junit \
      --env "$(brunoEnvironment)"
  displayName: 'Run Bruno Tests and Generate JUnit Report'

- script: |
    echo "== Debug: list files in ArtifactStagingDirectory =="
    ls -R "$(Build.ArtifactStagingDirectory)"
  displayName: 'Debug Generated Reports'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '$(Build.ArtifactStagingDirectory)/junit-report.xml'
    testRunTitle: 'Bruno API Tests'
  displayName: 'Publish Test Results to Azure DevOps'